<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <linearGradient id="headerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4A8" />
      <stop offset="50%" stop-color="#FCD218" />
      <stop offset="100%" stop-color="#D49000" />
    </linearGradient>
    <linearGradient id="headerRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C" />
      <stop offset="60%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#9B0008" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E1E4EA" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- V Monogram Crest -->
  <g transform="translate(6, 6) scale(0.8)">
    <!-- Rounded Shield Background -->
    <rect width="64" height="64" rx="16" fill="#13141B" stroke="rgba(252,210,24,0.3)" stroke-width="1.5" />
    <!-- Left Wing -->
    <polygon points="14,14 27,14 34,50 27,50" fill="url(#headerGold)" />
    <!-- Right Wing -->
    <polygon points="50,14 37,14 30,50 37,50" fill="url(#headerRuby)" />
    <!-- Diamond Play Center -->
    <polygon points="32,25 40,33 32,41 24,33" fill="#FFFFFF" opacity="0.95" filter="url(#softGlow)" />
    <polygon points="32,27 38,33 32,39 26,33" fill="#FCD218" />
  </g>

  <!-- Wordmark Text -->
  <text x="74" y="40" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="4" fill="url(#brandGrad)">
    VYN<tspan fill="#FCD218">O</tspan>RA
  </text>
  <text x="75" y="52" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3" fill="#8E92A4">
    CINEMA DISCOVERY
  </text>
</svg>