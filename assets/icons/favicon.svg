<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8" />
      <stop offset="40%" stop-color="#FCD218" />
      <stop offset="100%" stop-color="#E59800" />
    </linearGradient>
    <linearGradient id="vRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F1C" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#9B0008" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="24" fill="#0C0D12" />
  <rect width="96" height="96" x="2" y="2" rx="22" fill="none" stroke="rgba(252, 210, 24, 0.35)" stroke-width="2" />
  <!-- Left Wing -->
  <polygon points="20,24 40,24 50,78 40,78" fill="url(#vGold)" />
  <!-- Right Wing -->
  <polygon points="80,24 60,24 50,78 60,78" fill="url(#vRuby)" />
  <!-- Inner Play Beacon -->
  <polygon points="50,42 62,54 50,66 38,54" fill="#FFFFFF" opacity="0.9" />
  <polygon points="50,45 59,54 50,63 41,54" fill="#FCD218" />
</svg>