<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Custom Movie - PsalmStrings</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/common.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="shortcut icon" href="../media/WhatsApp Image 2025-04-04 at 04.52.12_e46090e3.jpg" type="image/x-icon" />
</head>
<body>
  <div class="auth-page-wrapper">
    <header class="auth-header">
      <a href="./homepage.html" class="site-logo">
        <i class="fas fa-film"></i> PsalmStrings
      </a>
      <div>
        <a href="./admin.html" class="btn-nav-signin"><i class="fas fa-tasks"></i> Manage Movies</a>
        <a href="./homepage.html" class="btn-nav-signin"><i class="fas fa-home"></i> Home</a>
      </div>
    </header>

    <main class="auth-content-container">
      <div class="auth-card" style="max-width: 600px;">
        <h1 class="auth-card-title">Add Custom Movie</h1>
        <p class="auth-card-subtitle">Add a community or indie film to the custom catalog collection.</p>

        <form id="uploadMovieForm">
          <div class="auth-form-group">
            <label for="movieName">Movie Title</label>
            <input type="text" id="movieName" placeholder="e.g. The Untold Story" required />
          </div>

          <div class="form-grid-2">
            <div class="auth-form-group">
              <label for="releaseDate">Release Date</label>
              <input type="date" id="releaseDate" required />
            </div>

            <div class="auth-form-group">
              <label for="category">Category / Genre</label>
              <select id="category" class="auth-form-group" style="width: 100%; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 12px; color: #fff;" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Action">Action</option>
                <option value="Drama">Drama</option>
                <option value="Comedy">Comedy</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Horror">Horror</option>
                <option value="Thriller">Thriller</option>
                <option value="Nollywood">Nollywood</option>
                <option value="Hollywood">Hollywood</option>
              </select>
            </div>
          </div>

          <div class="auth-form-group">
            <label for="description">Overview / Description</label>
            <textarea id="description" style="width: 100%; min-height: 90px; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 12px; color: #fff; font-family: inherit;" placeholder="Write a short summary of the plot..." required></textarea>
          </div>

          <div class="auth-form-group">
            <label for="posterUrl">Poster Image URL</label>
            <input type="url" id="posterUrl" placeholder="https://image.tmdb.org/... or external poster link" required />
          </div>

          <button type="submit" class="auth-submit-btn" id="submitBTN">
            <i class="fas fa-plus-circle"></i> Save Movie
          </button>
        </form>
      </div>
    </main>
  </div>

  <!-- Firebase SDKs & Core App Engine -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/app.js"></script>

  <script>
    const form = document.getElementById("uploadMovieForm");
    const submitBTN = document.getElementById("submitBTN");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBTN.disabled = true;
      submitBTN.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

      const movieName = document.getElementById("movieName").value.trim();
      const releaseDate = document.getElementById("releaseDate").value;
      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value.trim();
      const posterUrl = document.getElementById("posterUrl").value.trim();

      const movieDetails = {
        name: movieName,
        releaseDate: releaseDate,
        year: releaseDate ? releaseDate.substring(0, 4) : '2024',
        category: category,
        genre: category,
        description: description,
        image: posterUrl,
        img: posterUrl,
        createdBy: PsalmStrings.auth.currentUser?.uid || 'administrator',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      try {
        await firebase.firestore().collection("movies").add(movieDetails);
        PsalmStrings.ui.showToast("Movie added to directory successfully!", "success");
        form.reset();
        setTimeout(() => {
          window.location.href = "./admin.html";
        }, 900);
      } catch (error) {
        console.error("Error saving movie:", error);
        PsalmStrings.ui.showToast("Failed to save movie: " + error.message, "error");
      } finally {
        submitBTN.disabled = false;
        submitBTN.innerHTML = '<i class="fas fa-plus-circle"></i> Save Movie';
      }
    });
  </script>
</body>
</html>
